name: Build and Test 

on: 
  pull_request:
    branches: [pipfile-experiment]
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4

      - name: Install Python, Pipenv and Pipfile packages
        uses: kojoru/prepare-pipenv@v1
        with:
          python-version: ${{ matrix.python-version }}

          #installing requirements.txt
      - name: Install project (editable) + test/build tools
        run: |
          if [ -f requirements.txt ]; then pipenv run pip install -r requirements.txt; fi
          pipenv install -e .
          pipenv install pytest build twine

      - name: Test with pytest
        run: |
          pipenv install pytest
          pipenv --venv
          pipenv run python -m pytest

      - name: Build package
        run: |
          rm -rf dist build src/*.egg-info
          pipenv run python -m build .

      - name: Twine check (README/metadata)
        run: pipenv run twine check dist/*

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.python-version }}
          path: dist/*


  deliver:
    name: Publish
    if: github.event_name != 'pull_request' && startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-3.11
          path: dist

      - name: Install Python, pipenv and Pipfile packages
        uses: kojoru/prepare-pipenv@v1

      - name: Build package
        run: |
          pipenv install build
          pipenv run python -m build .

      - name: Publish to PyPI test server
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}

      - name: Publish to PyPI (production)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}


  #ADDED to verify upload
  verify-upload: 
    name: Verify install from registry
    if: github.event_name != 'pull_request'
    needs: [deliver]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Verify Install
      run: |
        python -m pip install --upgrade pip
        pip install eatnyc
        python - <<'PY'
        import eatnyc
        print("✅ Imported eatnyc OK. Version:", getattr(eatnyc, "__version__", "unknown"))
        PY